# /etc/mdev.conf: BusyBox mdev kuralları. Bölüm 5.
# Biçim: <aygıt-adı-düzenli-ifadesi> <kullanıcı>:<grup> <izin> [=yeni_ad | >taşı_ve_bağla] [@|$|*komut]
#   @komut: düğüm oluşturulduktan sonra, $komut: silinmeden önce, *komut: her iki durumda
null          root:root 666
zero          root:root 666
random        root:root 666
urandom       root:root 666
hwrng         root:root 600
ttyAMA[0-9]   root:root 660
vd[a-z][0-9]* root:root 660 >disk/%0
# Düğümü olmayan olaylar: sürücüsü yüklenmemiş aygıtlar için modülü yükle
$MODALIAS=.*  root:root 660 @modprobe -q "$MODALIAS"
